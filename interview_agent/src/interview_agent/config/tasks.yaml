match_and_score_candidate_task:

  description: > 
      Run through each CV, evaluate and match the candidates to the best job requirement based on their qualification, skills, past experience and suitability. Score each candidate to reflect their alignment with the job requirements, ensuring a fair and transparent assesment process. 

  JobRole:
  {job_role}

  Job Requirements:
  {job_requirements}

  agent: recruiter

  expected_output: >
    A ranked list of candidates with detailed scores and justification for each job position evaluation. Write an output file with the job name 

  output_json: >

    Name:
    Position:
    Total_Score:

  output_file: document/eveluation_report/{job_description}_1_round.json


interview_the_candidate_task:

  description: >
    Based on the each required skills of job description ask questions relevant to the job role. The quetions should be short and precise.  Wait for the user response, if the answer does match well with the context of the question ask further question on the same topic. 
    
    Example:

    If the question related to 'finding duplicate for SQL'

    candidate: I will run group by on one column and then find the count>1

    interviwer: Which columns will you choose for grouping? What are the other possible ways you can solve this problem?

  guardrail: >

    Number of question asked by the interviwer should not be more than 2 on a particular topic. 

    If the candidate takes longer than 3 mins to answer a question you tell "sorry we need to move to the next question keeping time in mind".

  agent: interviwer




