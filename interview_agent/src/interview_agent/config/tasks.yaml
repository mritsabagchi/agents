parse_CV_extract_information_task:
  description: >
    First, you MUST use the 'Read a file's content' tool to get the text from
    the file at '{resume_file}'.

    Then, parse the raw CV text you have read to extract key candidate
    information. Accurately identify all relevant details and structure them
    into a clean JSON output.
  expected_output: >
    A nested JSON object containing all extracted candidate information. The JSON
    must strictly adhere to the following schema: { "candidate_profile": { "name":
    "string", "location": "string", "email": "string", "phone": "string" },
    "professional_summary": { "experience_years": "integer", "summary_text":
    "string" }, "qualifications": [ { "degree": "string", "institution":
    "string", "graduation_year": "integer" } ], "skills": { "technical":
    ["list", "of", "strings"], "behavioral": ["list", "of", "strings"] } }

match_and_score_candidate_task:
  description: >
    Evaluate the candidate for the role by comparing their CV and the job description.
    Use the FileReadTool twice:
      1. Read the candidate's CV from '{resume_file}'
      2. Read the job description from '{job_description_file}'
    Then score the candidate (0–100) and justify the score. Also mention why you have given him less than hundren and what he might not be suitable for this role.
  expected_output: >
    {
      "candidate_name": "string",
      "position_evaluated": "string",
      "score": "integer",
      "justification": "string"
    }

interview_the_candidate_task:
  description: >
    Act as an expert interviewer. Your goal is to generate the single best
    question to ask next.

    1. Analyze the job requirements from '{job_requirements}'.

    2. Critically review the entire interview chat history: {chat_history} for the next question.

    3. Based on the last answer and overall context, formulate a logical and
    insightful follow-up question.

    4. If the user asks to repeat a question then repeat the question else do not repeat a topic. The question must be concise and precise. Do not repeat questions or add
    conversational fillers.

    # This was previously adding extra lines in the questions.
  expected_output:   ONLY the single, professional interview question.
      Do not add any other text, thoughts, greetings, or explanations.
      Do not ask me if it "meets the criteria".
      Just return the question.

